<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="hubGradIcon" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0071E3"/>
      <stop offset="50%" stop-color="#2997FF"/>
      <stop offset="100%" stop-color="#5856D6"/>
    </linearGradient>
    <linearGradient id="hubCore" x1="16" y1="16" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E5E5EA"/>
    </linearGradient>
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0071E3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Container with Apple-like squircle -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="#0A0A0C"/>
  <rect x="2" y="2" width="44" height="44" rx="12" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  
  <!-- Stylized Geometric "H" & "C" Hub Node -->
  <!-- Left Stem of H -->
  <rect x="13" y="14" width="4.5" height="20" rx="2.25" fill="url(#hubGradIcon)" filter="url(#iconGlow)"/>
  
  <!-- Right Stem of H that merges into a C-arc -->
  <rect x="30.5" y="14" width="4.5" height="20" rx="2.25" fill="url(#hubGradIcon)"/>
  
  <!-- Central Connecting Hub Bridge & Core Node -->
  <path d="M15 24h18" stroke="url(#hubGradIcon)" stroke-width="4.5" stroke-linecap="round"/>
  
  <!-- Orbital Connection Dots symbolizing Talent Network -->
  <circle cx="24" cy="24" width="6" height="6" r="3.5" fill="#FFFFFF"/>
  <circle cx="15.25" cy="14" r="2.25" fill="#64D2FF"/>
  <circle cx="32.75" cy="34" r="2.25" fill="#64D2FF"/>
</svg>
