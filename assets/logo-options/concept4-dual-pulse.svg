<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 54" width="260" height="54" fill="none">
  <defs>
    <linearGradient id="opt4Grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0047AB"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="opt4Grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0047AB"/>
    </linearGradient>
    <filter id="opt4Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2563EB" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Concept 4 Icon: Dual-Pulse Constellation (Dynamic Angular Pods + Hub Pulse) -->
  <g transform="translate(6, 5)">
    <rect x="0" y="0" width="44" height="44" rx="12" fill="#070E1E"/>
    <rect x="0" y="0" width="44" height="44" rx="12" stroke="rgba(37,99,235,0.3)" stroke-width="1"/>
    
    <!-- Left Convergent Wing (Ascending H bracket) -->
    <rect x="12" y="14" width="4.5" height="18" rx="2.25" fill="url(#opt4Grad1)"/>
    <path d="M14 23 L23 16" stroke="url(#opt4Grad1)" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Right Symmetrical Wing (Descending C bracket) -->
    <path d="M23 28 L32 21" stroke="url(#opt4Grad2)" stroke-width="4" stroke-linecap="round"/>
    <rect x="29.5" y="12" width="4.5" height="18" rx="2.25" fill="url(#opt4Grad2)"/>
    
    <!-- Central Talent Fusion Core -->
    <circle cx="23" cy="22" r="3.8" fill="url(#opt4Grad1)" stroke="#FFFFFF" stroke-width="2" filter="url(#opt4Glow)"/>
    <circle cx="23" cy="22" r="1.5" fill="#FFFFFF"/>
    
    <!-- Satellite Network Nodes -->
    <circle cx="14.25" cy="14" r="1.8" fill="#60A5FA"/>
    <circle cx="31.75" cy="30" r="1.8" fill="#60A5FA"/>
  </g>

  <!-- Typography -->
  <g transform="translate(62, 14)">
    <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', sans-serif" font-size="22" font-weight="700" letter-spacing="-0.4" fill="#0B132B">
      Hub<tspan fill="#0047AB">Crew</tspan>
    </text>
    <text x="1" y="32" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', sans-serif" font-size="8" font-weight="600" letter-spacing="2.8" fill="#50607A" text-transform="uppercase">
      TALENT SOLUTIONS
    </text>
  </g>
</svg>
