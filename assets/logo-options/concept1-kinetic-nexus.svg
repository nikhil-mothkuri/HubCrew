<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 54" width="260" height="54" fill="none">
  <defs>
    <linearGradient id="opt1GradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0047AB"/>
      <stop offset="60%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="opt1GradAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#002D72"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="opt1Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0047AB" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Concept 1 Icon: Kinetic Hub Nexus -->
  <g transform="translate(6, 5)">
    <!-- Base Squircle with crisp subtle border -->
    <rect x="0" y="0" width="44" height="44" rx="12" fill="#070E1E"/>
    <rect x="0" y="0" width="44" height="44" rx="12" stroke="rgba(37,99,235,0.3)" stroke-width="1"/>
    
    <!-- Outer Kinetic Arc Blades forming C-orbit -->
    <path d="M33 14 A 14 14 0 1 0 33 30" stroke="url(#opt1GradPrimary)" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- Inner Convergent Hub Pillars (forming H) -->
    <path d="M16 16 L16 28" stroke="url(#opt1GradPrimary)" stroke-width="3.5" stroke-linecap="round" filter="url(#opt1Glow)"/>
    <path d="M26 16 L26 28" stroke="url(#opt1GradAccent)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M16 22 L26 22" stroke="url(#opt1GradPrimary)" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Focal Energy Core Node -->
    <circle cx="21" cy="22" r="2.5" fill="#FFFFFF"/>
    <circle cx="33" cy="14" r="2" fill="#60A5FA"/>
    <circle cx="33" cy="30" r="2" fill="#60A5FA"/>
  </g>

  <!-- Typography -->
  <g transform="translate(62, 14)">
    <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', sans-serif" font-size="22" font-weight="700" letter-spacing="-0.5" fill="#0B132B">
      Hub<tspan fill="#0047AB">Crew</tspan>
    </text>
    <text x="1" y="32" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', sans-serif" font-size="8" font-weight="600" letter-spacing="2.8" fill="#50607A" text-transform="uppercase">
      TALENT SOLUTIONS
    </text>
  </g>
</svg>
