<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 54" width="260" height="54" fill="none">
  <defs>
    <linearGradient id="opt3Ribbon1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0047AB"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="opt3Ribbon2" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#002D72"/>
      <stop offset="50%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <filter id="opt3Shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0047AB" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Concept 3 Icon: Continuous Interlocking Ribbon HC -->
  <g transform="translate(6, 5)">
    <rect x="0" y="0" width="44" height="44" rx="12" fill="#070E1E"/>
    <rect x="0" y="0" width="44" height="44" rx="12" stroke="rgba(37,99,235,0.3)" stroke-width="1"/>
    
    <!-- Fluid Single-Line Ribbon Loop creating H & C -->
    <!-- Left Vertical Stem of H -->
    <path d="M14 12 L14 32" stroke="url(#opt3Ribbon1)" stroke-width="4.5" stroke-linecap="round"/>
    
    <!-- Ribbon Crossing that sweeps into circular C -->
    <path d="M14 22 C 20 22, 22 13, 29 13 C 34 13, 36 17, 36 22 C 36 27, 34 31, 29 31 C 24 31, 22 26, 22 22" 
          stroke="url(#opt3Ribbon2)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#opt3Shadow)"/>
          
    <!-- Core Hub Anchor Accent -->
    <circle cx="14" cy="22" r="2.8" fill="#FFFFFF"/>
    <circle cx="29" cy="22" r="2" fill="#60A5FA"/>
  </g>

  <!-- Typography -->
  <g transform="translate(62, 14)">
    <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', sans-serif" font-size="22" font-weight="700" letter-spacing="-0.4" fill="#0B132B">
      Hub<tspan fill="#0047AB">Crew</tspan>
    </text>
    <text x="1" y="32" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', sans-serif" font-size="8" font-weight="600" letter-spacing="2.8" fill="#50607A" text-transform="uppercase">
      TALENT SOLUTIONS
    </text>
  </g>
</svg>
