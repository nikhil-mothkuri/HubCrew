<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 50" width="240" height="50" fill="none">
  <defs>
    <linearGradient id="primaryHubGrad" x1="6" y1="6" x2="38" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0047AB"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#002D72"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="100%" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <!-- Icon Mark (Squircle + Hub Network) -->
  <g transform="translate(4, 5)">
    <rect x="0" y="0" width="40" height="40" rx="10" fill="#070E1E"/>
    <rect x="0" y="0" width="40" height="40" rx="10" stroke="rgba(37,99,235,0.25)" stroke-width="1"/>
    
    <!-- Stylized Hub Nodes -->
    <rect x="10" y="10" width="4" height="20" rx="2" fill="url(#primaryHubGrad)"/>
    <rect x="26" y="10" width="4" height="20" rx="2" fill="url(#primaryHubGrad)"/>
    <path d="M12 20h16" stroke="url(#primaryHubGrad)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="20" cy="20" r="3" fill="#FFFFFF"/>
    <circle cx="12" cy="10" r="2" fill="#60A5FA"/>
    <circle cx="28" cy="30" r="2" fill="#60A5FA"/>
  </g>

  <!-- Typography: Modern geometric sans -->
  <g transform="translate(56, 12)">
    <!-- HubCrew main brand -->
    <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', sans-serif" font-size="22" font-weight="700" letter-spacing="-0.5" fill="#0B132B">
      Hub<tspan fill="#0047AB">Crew</tspan>
    </text>
    <!-- Subtitle / Tagline -->
    <text x="1" y="32" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', sans-serif" font-size="8" font-weight="600" letter-spacing="2.8" fill="#5A6B82" text-transform="uppercase">
      TALENT SOLUTIONS
    </text>
  </g>
</svg>
