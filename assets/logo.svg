<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64" fill="none">
  <!-- Converging Hub & Talent Beacon Icon (Option 4) -->
  <g transform="translate(0, 0)">
    <!-- 5 Converging Sourcing Lines -->
    <g stroke="#14213D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="5.0" y1="10.0" x2="38.0" y2="32.0"/>
      <line x1="5.0" y1="21.0" x2="38.0" y2="32.0"/>
      <line x1="5.0" y1="32.0" x2="38.0" y2="32.0"/>
      <line x1="5.0" y1="43.0" x2="38.0" y2="32.0"/>
      <line x1="5.0" y1="54.0" x2="38.0" y2="32.0"/>
    </g>
    <!-- Gold Placement Bridge & Beacon -->
    <line x1="38" y1="32" x2="54" y2="32" stroke="#B8892B" stroke-width="5" stroke-linecap="round"/>
    <circle cx="56" cy="32" r="5" fill="#B8892B"/>
  </g>

  <!-- Typography -->
  <g transform="translate(74, 8)">
    <!-- Wordmark: hubcrew -->
    <text x="0" y="30" font-family="'Inter', -apple-system, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.03em">
      <tspan fill="#B8892B">hub</tspan><tspan fill="#14213D">crew</tspan>
    </text>
    <!-- Tagline: Be heard, be hired -->
    <text x="1" y="47" font-family="'Inter', -apple-system, sans-serif" font-size="11.5" font-weight="500" fill="#566074" letter-spacing="0.3px">
      Be heard, be hired
    </text>
  </g>
</svg>
