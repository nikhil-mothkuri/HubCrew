<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="auto" class="hubcrew-vector-map" aria-label="HubCrew Geographic Coverage Map: Hyderabad Delivery Base, Pan-African Corridor, and Southeast Asia">
  <defs>
    <!-- Gradients & Filters -->
    <linearGradient id="africaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0047AB" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0047AB" stop-opacity="0.08" />
    </linearGradient>
    <linearGradient id="indiaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0047AB" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0047AB" stop-opacity="0.12" />
    </linearGradient>
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0047AB" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#0047AB" stop-opacity="0.10" />
    </linearGradient>
    <filter id="pinShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0047AB" flood-opacity="0.3" />
    </filter>
  </defs>

  <style>
    .map-bg { fill: #F8FAFC; }
    .map-grid { stroke: #E2E8F0; stroke-width: 0.75; stroke-dasharray: 4, 4; }
    .continent-africa { fill: url(#africaGrad); stroke: #0047AB; stroke-width: 1.5; stroke-linejoin: round; }
    .continent-india { fill: url(#indiaGrad); stroke: #0047AB; stroke-width: 1.8; stroke-linejoin: round; }
    .continent-sea { fill: url(#seaGrad); stroke: #0047AB; stroke-width: 1.5; stroke-linejoin: round; }
    .land-muted { fill: #EBF0F7; stroke: #CBD5E1; stroke-width: 1; stroke-linejoin: round; opacity: 0.6; }
    .arc-corridor { stroke: #0047AB; stroke-width: 1.8; stroke-dasharray: 6, 6; fill: none; opacity: 0.7; }
    .pulse-ring { animation: pulse 2.5s infinite; transform-origin: center; }
    @keyframes pulse {
      0% { r: 6px; opacity: 0.9; }
      70% { r: 18px; opacity: 0; }
      100% { r: 18px; opacity: 0; }
    }
  </style>

  <!-- Background Base Container -->
  <rect width="1000" height="520" rx="16" class="map-bg" />

  <!-- Latitude / Longitude Subtle Reference Lines -->
  <line x1="50" y1="130" x2="950" y2="130" class="map-grid" />
  <line x1="50" y1="260" x2="950" y2="260" class="map-grid" /> <!-- Equator -->
  <line x1="50" y1="390" x2="950" y2="390" class="map-grid" />
  <line x1="200" y1="40" x2="200" y2="480" class="map-grid" />
  <line x1="450" y1="40" x2="450" y2="480" class="map-grid" />
  <line x1="680" y1="40" x2="680" y2="480" class="map-grid" />
  <line x1="880" y1="40" x2="880" y2="480" class="map-grid" />

  <!-- Secondary/Context Geography: Europe & Middle East Outlines (Muted context) -->
  <path class="land-muted" d="M120,40 L160,50 L200,45 L220,60 L240,55 L270,70 L260,95 L220,95 L190,110 L160,105 L130,90 Z" />
  <path class="land-muted" d="M420,130 L450,140 L490,160 L510,190 L500,230 L460,235 L440,210 L410,195 L405,160 Z" /> <!-- Arabian Peninsula -->

  <!-- =========================================================================
       1. PAN-AFRICAN CONTINENT (Fully Shaded as Pan-African Talent Region)
       ========================================================================= -->
  <g id="pan-africa-region">
    <!-- Africa Mainland Silhouette -->
    <path class="continent-africa" d="
      M 160,110 
      C 190,105 230,110 270,115 
      C 300,120 330,110 360,115
      C 380,120 405,145 395,175
      C 425,185 450,210 440,230
      C 420,240 395,250 380,270
      C 370,300 375,340 355,380
      C 340,410 320,450 295,465
      C 275,475 255,460 250,430
      C 240,400 220,380 215,350
      C 205,330 185,310 160,285
      C 130,265 110,240 100,210
      C 90,175 110,145 130,130
      Z
    " />
    <!-- Madagascar Island -->
    <path class="continent-africa" d="M 405,350 C 415,340 425,360 420,395 C 415,420 400,435 395,415 C 390,390 395,365 405,350 Z" />

    <!-- Pan-African Region Highlight Glow & Badge -->
    <g transform="translate(245, 260)">
      <rect x="-85" y="-22" width="170" height="38" rx="8" fill="#FFFFFF" stroke="#0047AB" stroke-width="1.5" filter="url(#pinShadow)" />
      <circle cx="-65" cy="-3" r="5" fill="#0047AB" />
      <text x="-52" y="2" font-family="'Inter', sans-serif" font-size="11.5" font-weight="700" fill="#0047AB">PAN-AFRICA</text>
      <text x="-85" y="32" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#50607A" text-anchor="middle">54 Countries Talent Reach</text>
    </g>
  </g>

  <!-- =========================================================================
       2. INDIA & DELIVERY BASE (HYDERABAD PIN)
       ========================================================================= -->
  <g id="india-region">
    <!-- India Subcontinent Outline -->
    <path class="continent-india" d="
      M 560,110 
      C 590,95 620,105 650,110 
      C 670,120 675,140 680,165 
      C 670,185 660,205 640,230 
      C 630,250 620,280 600,310 
      C 590,325 585,325 580,310 
      C 565,280 550,250 540,225 
      C 530,195 530,170 540,145 
      C 545,125 550,115 560,110 
      Z
    " />
    <!-- Sri Lanka -->
    <path class="continent-india" d="M 605,325 C 612,320 618,330 615,342 C 610,350 602,345 605,325 Z" />

    <!-- Hyderabad Delivery Base Coordinates: ~ (580, 240) -->
    <!-- Radar Pulse Wave -->
    <circle cx="582" cy="240" r="16" fill="none" stroke="#0047AB" stroke-width="1.5" opacity="0.6">
      <animate attributeName="r" values="8;24;32" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0.3;0" dur="2.4s" repeatCount="indefinite" />
    </circle>
    
    <!-- Delivery Base Pin -->
    <g transform="translate(582, 240)" filter="url(#pinShadow)">
      <circle cx="0" cy="0" r="8" fill="#0047AB" />
      <circle cx="0" cy="0" r="4" fill="#FFFFFF" />
      <!-- Base Label Card -->
      <g transform="translate(-75, -54)">
        <rect x="0" y="0" width="150" height="42" rx="8" fill="#0047AB" />
        <polygon points="75,42 69,48 81,42" fill="#0047AB" />
        <text x="75" y="18" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">DELIVERY BASE</text>
        <text x="75" y="32" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#E2E8F0" text-anchor="middle">Hyderabad, India</text>
      </g>
    </g>
  </g>

  <!-- =========================================================================
       3. SOUTHEAST ASIA (THAILAND, MALAYSIA, INDONESIA)
       ========================================================================= -->
  <g id="southeast-asia-region">
    <!-- Thailand / Indochina -->
    <path class="continent-sea" d="
      M 720,160 
      C 740,155 765,165 770,185 
      C 775,205 765,225 755,245 
      C 745,265 735,285 730,305 
      C 725,295 720,265 725,245 
      C 720,220 710,190 720,160 
      Z
    " />

    <!-- Malaysia (Peninsular + Borneo) -->
    <path class="continent-sea" d="M 730,305 C 740,315 745,335 740,345 C 735,348 725,335 725,320 Z" />
    <path class="continent-sea" d="M 780,310 C 810,300 840,310 835,330 C 825,345 790,340 780,310 Z" />

    <!-- Indonesia Islands (Sumatra, Java, Kalimantan, Sulawesi) -->
    <!-- Sumatra -->
    <path class="continent-sea" d="M 715,315 C 740,345 765,385 780,410 C 770,418 750,385 710,340 C 705,325 710,315 715,315 Z" />
    <!-- Java -->
    <path class="continent-sea" d="M 785,415 C 820,418 855,425 870,430 C 865,438 820,432 785,422 Z" />
    <!-- Sulawesi & Eastern Islands -->
    <path class="continent-sea" d="M 855,320 C 870,325 865,355 850,370 C 845,350 850,335 855,320 Z" />

    <!-- Thailand Pin (Bangkok ~ 740, 225) -->
    <g transform="translate(740, 225)" filter="url(#pinShadow)">
      <circle cx="0" cy="0" r="5" fill="#0047AB" />
      <circle cx="0" cy="0" r="2.5" fill="#FFFFFF" />
      <rect x="10" y="-12" width="70" height="22" rx="4" fill="#FFFFFF" stroke="#0047AB" stroke-width="1" />
      <text x="45" y="3" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#0047AB" text-anchor="middle">Thailand</text>
    </g>

    <!-- Malaysia Pin (Kuala Lumpur ~ 735, 328) -->
    <g transform="translate(735, 328)" filter="url(#pinShadow)">
      <circle cx="0" cy="0" r="5" fill="#0047AB" />
      <circle cx="0" cy="0" r="2.5" fill="#FFFFFF" />
      <rect x="10" y="-12" width="70" height="22" rx="4" fill="#FFFFFF" stroke="#0047AB" stroke-width="1" />
      <text x="45" y="3" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#0047AB" text-anchor="middle">Malaysia</text>
    </g>

    <!-- Indonesia Pin (Jakarta ~ 810, 420) -->
    <g transform="translate(810, 420)" filter="url(#pinShadow)">
      <circle cx="0" cy="0" r="5" fill="#0047AB" />
      <circle cx="0" cy="0" r="2.5" fill="#FFFFFF" />
      <rect x="10" y="-12" width="74" height="22" rx="4" fill="#FFFFFF" stroke="#0047AB" stroke-width="1" />
      <text x="47" y="3" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#0047AB" text-anchor="middle">Indonesia</text>
    </g>
  </g>

  <!-- =========================================================================
       4. STRATEGIC CORRIDOR CONNECTION ARCS (From Hyderabad Hub)
       ========================================================================= -->
  <!-- Arc: Hyderabad to Africa (Pan-African Center) -->
  <path d="M 582,240 Q 400,180 250,260" class="arc-corridor" />
  
  <!-- Arc: Hyderabad to Thailand -->
  <path d="M 582,240 Q 660,200 740,225" class="arc-corridor" />

  <!-- Arc: Hyderabad to Malaysia -->
  <path d="M 582,240 Q 670,270 735,328" class="arc-corridor" />

  <!-- Arc: Hyderabad to Indonesia -->
  <path d="M 582,240 Q 700,320 810,420" class="arc-corridor" />

  <!-- =========================================================================
       5. MAP CAPTION & STAT CHIP BAR (Bottom Strip)
       ========================================================================= -->
  <g transform="translate(40, 470)">
    <rect x="0" y="0" width="920" height="38" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <!-- Pin Icon -->
    <circle cx="24" cy="19" r="6" fill="#0047AB" />
    <text x="42" y="23" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#0B132B">Hyderabad Base.</text>
    <text x="145" y="23" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#50607A">Pan-African and Southeast Asian hiring corridors.</text>
    
    <!-- Warm Amber Stat Chip -->
    <rect x="740" y="7" width="166" height="24" rx="12" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1" />
    <text x="823" y="23" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#92400E" text-anchor="middle">PAN-AFRICAN REACH</text>
  </g>
</svg>

